<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b4332" />

    <!-- Primary Meta Tags -->
    <title>NM Infrastructure — We Build Your Dreams</title>
    <meta name="title" content="NM Infrastructure — We Build Your Dreams" />
    <meta
      name="description"
      content="Landmark residential, commercial, industrial, and infrastructure projects across India by NM Infrastructure."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NM Infrastructure — We Build Your Dreams" />
    <meta
      property="og:description"
      content="High-definition video showcases of civil engineering, structural steel, and infrastructure projects."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!--
    ===================================================================================
    |                             DEPLOYMENT GUIDE & SETUP                             |
    ===================================================================================
    
    1. PRODUCTION BUILD COMMAND:
       $ npm run build
       (Or: npx vite build)
       
       This uses Vite + TanStack Start + Nitro to output:
       - Static Assets: .output/public/
       - SSR Server Entry: .output/server/index.mjs

    2. CLOUDFLARE PAGES / WORKERS DEPLOYMENT:
       - Output Directory: .output/public
       - Build Command: npm run build
       - Prebuilt Deployment:
         $ npx nitro deploy --prebuilt
         $ npx wrangler deploy

    3. VERCEL DEPLOYMENT:
       - Framework Preset: Vite / Other
       - Output Directory: .output/public
       - Build Command: npm run build
       - Rewrites Rule (vercel.json):
         {
           "rewrites": [ { "source": "/(.*)", "destination": "/index.html" } ]
         }

    4. NETLIFY DEPLOYMENT:
       - Publish Directory: .output/public
       - Build Command: npm run build
       - Redirects Rule (_redirects):
         /*   /index.html   200

    5. NODE.JS PRODUCTION SERVER (VPS / DOCKER):
       $ node .output/server/index.mjs
       Or preview locally via:
       $ npm run preview

    ===================================================================================
    -->
  </head>
  <body class="bg-background text-foreground antialiased">
    <!-- Root Container for TanStack Start / React Application -->
    <div id="root"></div>

    <!-- Application Module Entry Script -->
    <script type="module" src="/src/start.ts"></script>
  </body>
</html>
